# Builds a release tarball and attaches it to a GitHub release.
#
# Push a `v*` tag to publish. A manual run (workflow_dispatch) only produces an
# Actions artifact, so the build can be verified without cutting a release.
#
# The package list mirrors scripts/provision-vm.sh; keep the two in sync.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev wayland-protocols libxkbcommon-dev \
            libinput-dev libudev-dev libgbm-dev libdrm-dev libseat-dev \
            libpixman-1-dev libegl1-mesa-dev libgles2-mesa-dev libdbus-1-dev \
            libsystemd-dev xkb-data

      # No toolchain action: rustup on the runner honors rust-toolchain.toml.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --features tty

      - name: Package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r .packages[0].version)
          mkdir "xfar-$VERSION"
          cp target/release/xfar "xfar-$VERSION/xfar"
          cp README.md LICENSE-APACHE LICENSE-MIT "xfar-$VERSION/"
          tar -czf "xfar-$VERSION-x86_64-unknown-linux-gnu.tar.gz" "xfar-$VERSION"
          echo "TARBALL=xfar-$VERSION-x86_64-unknown-linux-gnu.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: xfar-tarball
          path: xfar-*.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload --clobber "$GITHUB_REF_NAME" "$TARBALL"
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" --generate-notes \
              --title "xfar $GITHUB_REF_NAME"
          fi
